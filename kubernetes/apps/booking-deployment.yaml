# Deployment helper substitutes the reviewed booking-image.txt digest locally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: trafficxx
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: trafficxx-booking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafficxx-booking
        azure.workload.identity/use: 'true'
    spec:
      serviceAccountName: booking
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        agentpool: apps
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: trafficxx-booking
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: temporary
        emptyDir:
          sizeLimit: 64Mi
      containers:
      - name: booking
        image: trafficxxacre8708a85.azurecr.io/trafficxx@sha256:d00af2abd005f9c73157b8db532fbc45ea1bb51b68bdb2b8cee71fa00afad9e3
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - trafficxx.booking:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: BOOKING_DB_POOL_MAX
          value: '4'
        - name: DATABASE_AUTH_MODE
          value: workload_identity
        - name: PGHOST
          value: trafficxx-pg-e8708a85.postgres.database.azure.com
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: trafficxx
        - name: PGUSER
          value: trafficxx-lab-booking
        - name: PGSSLROOTCERT
          value: /etc/ssl/certs/ca-certificates.crt
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary
          mountPath: /tmp
