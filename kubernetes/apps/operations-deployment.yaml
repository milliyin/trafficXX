apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations
  namespace: trafficxx
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: trafficxx-operations
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafficxx-operations
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: operations
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        agentpool: apps
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trafficxx-operations
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: operations
          # Reviewed ACR build ca2, operations-20261022222812-28732.
          image: trafficxxacre8708a85.azurecr.io/trafficxx@sha256:dd4e53ba28a0cd1d052700b56f82bd023e09ec7731324b221bc793fc9d5b7dc9
          imagePullPolicy: IfNotPresent
          command: [uvicorn, trafficxx.operations:app, --host, "0.0.0.0", --port, "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: EXPECTED_HEARTBEAT_WORKERS
              value: publisher,consumer
            - name: BACKLOG_ALERT_SECONDS
              value: "30"
            - name: DATABASE_AUTH_MODE
              value: workload_identity
            - name: PGHOST
              value: trafficxx-pg-e8708a85.postgres.database.azure.com
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: trafficxx
            - name: PGUSER
              value: trafficxx-lab-operations
            - name: PGSSLROOTCERT
              value: /etc/ssl/certs/ca-certificates.crt
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
