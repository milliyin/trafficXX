apiVersion: batch/v1
kind: Job
metadata:
  name: read-load-check
  namespace: trafficxx
  labels:
    app.kubernetes.io/name: trafficxx-read-load-check
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafficxx-read-load-check
    spec:
      serviceAccountName: read-load-check
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      nodeSelector:
        agentpool: apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: check
          configMap:
            name: read-load-files
      containers:
        - name: check
          image: trafficxxacre8708a85.azurecr.io/trafficxx:build-required
          command: [python, -u, /checks/probe.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: check
              mountPath: /checks
              readOnly: true
