apiVersion: batch/v1
kind: Job
metadata:
  name: browse-token-renewal-check
  namespace: trafficxx
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 93600
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: browse
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        agentpool: apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: check
          configMap:
            name: browse-token-renewal-files
      containers:
        - name: check
          image: trafficxxacre8708a85.azurecr.io/trafficxx:build-required
          command: [python, -u, /checks/check-token-renewal.py]
          env:
            - name: PYTHONPATH
              value: /app
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DATABASE_AUTH_MODE
              value: workload_identity
            - name: PGHOST
              value: trafficxx-pg-e8708a85.postgres.database.azure.com
            - name: PGDATABASE
              value: trafficxx
            - name: PGUSER
              value: trafficxx-lab-browse
            - name: PGSSLROOTCERT
              value: /etc/ssl/certs/ca-certificates.crt
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: check
              mountPath: /checks
              readOnly: true
