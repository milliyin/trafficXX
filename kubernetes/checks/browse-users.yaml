apiVersion: batch/v1
kind: Job
metadata:
  name: browse-users-50-v2
  namespace: trafficxx
  labels:
    app.kubernetes.io/name: trafficxx-browse-users
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafficxx-browse-users
    spec:
      serviceAccountName: read-load-check
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      nodeSelector:
        agentpool: apps
      # Helper replaces this with an existing ready apps node. Direct binding
      # prevents this diagnostic from asking cluster autoscaler for a new node.
      nodeName: existing-apps-node-required
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: check
          configMap:
            name: read-load-files
        - name: state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      containers:
        - name: check
          image: trafficxxacre8708a85.azurecr.io/trafficxx:build-required
          command: [python, -u, /checks/probe.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: check
              mountPath: /checks
              readOnly: true
            - name: state
              mountPath: /state
