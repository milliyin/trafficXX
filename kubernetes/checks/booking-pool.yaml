apiVersion: batch/v1
kind: Job
metadata:
  name: booking-pool-check
  namespace: trafficxx
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: booking
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        agentpool: apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: trafficxxacre8708a85.azurecr.io/trafficxx:build-required
          command: [python, -m, trafficxx.check_booking_pool]
          env:
            - name: DATABASE_AUTH_MODE
              value: workload_identity
            - name: PGHOST
              value: trafficxx-pg-e8708a85.postgres.database.azure.com
            - name: PGDATABASE
              value: trafficxx
            - name: PGUSER
              value: trafficxx-lab-booking
            - name: PGSSLROOTCERT
              value: /etc/ssl/certs/ca-certificates.crt
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
