apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: trafficxx-monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: trafficxx-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: trafficxx-monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trafficxx-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafficxx-grafana
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      nodeSelector:
        agentpool: apps
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
        - name: credentials
          secret:
            secretName: grafana-admin
            defaultMode: 288
            items:
              - key: GF_SECURITY_ADMIN_USER
                path: admin-user
              - key: GF_SECURITY_ADMIN_PASSWORD
                path: admin-password
        - name: datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: providers
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER__FILE
              value: /run/secrets/grafana/admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /run/secrets/grafana/admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_LOG_MODE
              value: console
            - name: GF_PATHS_LOGS
              value: /var/lib/grafana/logs
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: temporary
              mountPath: /tmp
            - name: credentials
              mountPath: /run/secrets/grafana
              readOnly: true
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: trafficxx-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trafficxx-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
