apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: trafficxx-monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: trafficxx-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: trafficxx-monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: trafficxx-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafficxx-prometheus
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      nodeSelector:
        agentpool: apps
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            defaultMode: 292
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
      initContainers:
        - name: validate-config
          image: quay.io/prometheus/prometheus:v3.15.1
          command: [/bin/promtool, check, config, /etc/prometheus/prometheus.yml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=3GB
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: trafficxx-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trafficxx-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
