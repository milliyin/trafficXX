rule_files:
- booking-alerts.yml
evaluation_interval: 15s
tests:
- name: healthy two pods
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 10m
    alertname: TrafficxxBookingTargetsUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: TrafficxxBookingPoolMetricsMissing
    exp_alerts: []
  - eval_time: 10m
    alertname: TrafficxxBookingPoolWaiting
    exp_alerts: []
  - eval_time: 10m
    alertname: TrafficxxBookingPoolBorrowErrors
    exp_alerts: []
  - eval_time: 10m
    alertname: TrafficxxBookingPoolConnectionErrors
    exp_alerts: []
- name: all target series absent still alerts
  interval: 15s
  input_series: []
  alert_rule_test:
  - eval_time: 1m45s
    alertname: TrafficxxBookingTargetsUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: TrafficxxBookingTargetsUnavailable
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
      exp_annotations: &id001
        summary: Fewer than two Booking scrape targets are healthy
        description: Expected two ready Booking replicas; DNS discovery also removes
          unready pods.
- name: one pod disappeared from DNS
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 2m
    alertname: TrafficxxBookingTargetsUnavailable
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
      exp_annotations: *id001
- name: one target is down
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 2m
    alertname: TrafficxxBookingTargetsUnavailable
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
      exp_annotations: *id001
- name: target recovers and warning clears
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x11 1+0x28
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 2m
    alertname: TrafficxxBookingTargetsUnavailable
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
      exp_annotations: *id001
  - eval_time: 3m
    alertname: TrafficxxBookingTargetsUnavailable
    exp_alerts: []
- name: successful scrape missing pool metrics
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 1m45s
    alertname: TrafficxxBookingPoolMetricsMissing
    exp_alerts: []
  - eval_time: 2m
    alertname: TrafficxxBookingPoolMetricsMissing
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
        instance: 10.244.0.2:8000
      exp_annotations:
        summary: Booking pool metrics are missing from a healthy scrape
        description: A successful target scrape has not exposed pool size for two
          minutes.
- name: short wait spike does not fire
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0 1 1 0+0x37
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 2m
    alertname: TrafficxxBookingPoolWaiting
    exp_alerts: []
- name: sustained waiting fires then clears
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x4 0+0x35
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 45s
    alertname: TrafficxxBookingPoolWaiting
    exp_alerts: []
  - eval_time: 1m
    alertname: TrafficxxBookingPoolWaiting
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
        instance: 10.244.0.1:8000
      exp_annotations:
        summary: Booking database pool has queued requests
        description: A pool has had waiting borrowers for at least one minute.
  - eval_time: 1m15s
    alertname: TrafficxxBookingPoolWaiting
    exp_alerts: []
- name: TrafficxxBookingPoolBorrowErrors new error fires and ages out
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x4 1+0x35
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 2m
    alertname: TrafficxxBookingPoolBorrowErrors
    exp_alerts: []
  - eval_time: 2m15s
    alertname: TrafficxxBookingPoolBorrowErrors
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
        instance: 10.244.0.1:8000
      exp_annotations:
        summary: Booking database pool has recent borrow failures
        description: A five-minute borrow-error increase has remained visible for
          one minute.
  - eval_time: 7m
    alertname: TrafficxxBookingPoolBorrowErrors
    exp_alerts: []
- name: TrafficxxBookingPoolConnectionErrors new error fires and ages out
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x4 1+0x35
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 2m
    alertname: TrafficxxBookingPoolConnectionErrors
    exp_alerts: []
  - eval_time: 2m15s
    alertname: TrafficxxBookingPoolConnectionErrors
    exp_alerts:
    - exp_labels:
        component: booking-pool
        severity: warning
        job: trafficxx-booking-pool
        instance: 10.244.0.1:8000
      exp_annotations:
        summary: Booking database pool has recent connection failures
        description: A five-minute connection-error increase has remained visible
          for one minute.
  - eval_time: 7m
    alertname: TrafficxxBookingPoolConnectionErrors
    exp_alerts: []
- name: historical errors alone do not fire
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 9+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 9+0x40
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 10m
    alertname: TrafficxxBookingPoolBorrowErrors
    exp_alerts: []
  - eval_time: 10m
    alertname: TrafficxxBookingPoolConnectionErrors
    exp_alerts: []
- name: counter reset is not a new error
  interval: 15s
  input_series:
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 9+0x4 0+0x35
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.1:8000"}
    values: 9+0x4 0+0x35
  - series: up{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_size{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 1+0x40
  - series: trafficxx_booking_pool_waiting{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_borrow_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  - series: trafficxx_booking_pool_connection_errors_total{job="trafficxx-booking-pool",instance="10.244.0.2:8000"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 3m
    alertname: TrafficxxBookingPoolBorrowErrors
    exp_alerts: []
  - eval_time: 3m
    alertname: TrafficxxBookingPoolConnectionErrors
    exp_alerts: []
