global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: trafficxx-lab-aks
    environment: lab

scrape_configs:
  - job_name: trafficxx-operations
    metrics_path: /metrics
    static_configs:
      - targets: [operations.trafficxx.svc.cluster.local:80]
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets: [127.0.0.1:9090]
