global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: trafficxx-lab-aks
    environment: lab

rule_files:
  - /etc/prometheus/browse-alerts.yml
  - /etc/prometheus/booking-alerts.yml

scrape_configs:
  - job_name: trafficxx-operations
    metrics_path: /metrics
    static_configs:
      - targets: [operations.trafficxx.svc.cluster.local:80]
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets: [127.0.0.1:9090]
  - job_name: trafficxx-browse-pool
    metrics_path: /metrics
    dns_sd_configs:
      - names: [browse-metrics.trafficxx.svc.cluster.local]
        type: A
        port: 8000
        refresh_interval: 30s
  - job_name: trafficxx-booking-pool
    metrics_path: /metrics
    dns_sd_configs:
      - names: [booking-metrics.trafficxx.svc.cluster.local]
        type: A
        port: 8000
        refresh_interval: 30s
